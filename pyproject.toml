[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelmind"
version = "0.1.0"
description = "Multimodal Geospatial Intelligence Platform – building change detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
eda = ["matplotlib>=3.8"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
# torch: install the CPU or CUDA wheel matching your machine (see README)
dl = ["torch>=2.2", "mlflow-skinny>=3", "sqlalchemy>=2", "alembic>=1.13", "pyyaml>=6"]
rag = ["qdrant-client>=1.12", "fastembed>=0.5", "pypdf>=4", "anthropic>=2", "pyyaml>=6"]
agents = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=2"]
ui = ["streamlit>=1.40", "requests>=2.31", "pandas>=2"]
dev = [
    "pixelmind[eda,ml,dl,rag,agents,ui]",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
